{% load static %}<!DOCTYPE html>
<html lang="es" data-tema="">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión — Farmacia Privada</title>
    <meta name="description" content="Accede al sistema de gestión de Farmacia Privada.">
    <link rel="icon" href="{% static 'favicon.svg' %}" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="{% static 'css/app.css' %}" rel="stylesheet">
</head>
<body class="login-page">

  <div class="login-card">
    <div class="text-center">
      <div class="login-logo"><i class="bi bi-prescription2"></i></div>
      <h1 class="login-title">Farmacia Privada</h1>
      <p class="login-subtitle">Sistema de Gestión Farmacéutica</p>
    </div>

    <form method="post">
      {% csrf_token %}
      {% if form.non_field_errors %}
        <div class="alert alert-danger py-2" style="background:rgba(220,53,69,.2);color:#ff8a8a;border:1px solid rgba(220,53,69,.3);border-left:4px solid #dc3545;">
          {{ form.non_field_errors }}
        </div>
      {% endif %}
      <div class="mb-3">
        <label class="form-label"><i class="bi bi-person me-1"></i>Usuario</label>
        {{ form.username }}
      </div>
      <div class="mb-4">
        <label class="form-label"><i class="bi bi-lock me-1"></i>Contraseña</label>
        {{ form.password }}
      </div>
      <button type="submit" class="btn btn-primary w-100">
        <i class="bi bi-box-arrow-in-right me-2"></i>Ingresar al sistema
      </button>
    </form>

    <div class="text-center mt-4" style="font-size:.75rem; color:rgba(255,255,255,.4);">
      <i class="bi bi-shield-lock me-1"></i>Conexión segura · v1.0
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
