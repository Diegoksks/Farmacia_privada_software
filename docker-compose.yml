version: '3.8'

services:
  web:
    build: .
    ports:
      - "80:8000"
    volumes:
      - .:/app
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:?Configura SECRET_KEY en .env}
      - ALLOWED_HOSTS=*
      - SECURE_SSL_REDIRECT=False  # Se pone en False si estás usando un Load Balancer que maneja el SSL
      - DATABASE_URL=sqlite:////app/db.sqlite3
      - EMAIL_HOST_USER=${EMAIL_HOST_USER}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
    restart: always
